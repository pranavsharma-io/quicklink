<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink Hyper - Professional URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
            --bg-color: #f4f7f9;
            --container-bg: #ffffff;
            --text-color: #1a202c;
            --sub-text-color: #5a6474;
            --border-color: #e2e8f0;
            --input-bg: #fdfdff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --shadow-color: rgba(79, 70, 229, 0.15);
            --switch-bg: #cbd5e1;
            --switch-fg: #ffffff;
            --icon-color: #9ca3af;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --container-bg: #1f2937;
            --text-color: #f9fafb;
            --sub-text-color: #9ca3af;
            --border-color: #374151;
            --input-bg: #111827;
            --primary-color: #6366f1;
            --primary-hover: #818cf8;
            --shadow-color: rgba(99, 102, 241, 0.2);
            --switch-bg: #374151;
            --switch-fg: #111827;
            --icon-color: #6b7280;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background: var(--container-bg);
            padding: 2rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 750px;
            text-align: center;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .header { position: relative; }
        .theme-switch-wrapper { position: absolute; top: -15px; right: -15px; } .theme-switch { display: inline-block; height: 30px; position: relative; width: 60px; } .theme-switch input { display: none; } .slider { background-color: var(--switch-bg); position: absolute; inset: 0; cursor: pointer; transition: .4s; border-radius: 34px; } .slider:before { background-color: var(--switch-fg); content: ""; height: 22px; width: 22px; position: absolute; bottom: 4px; left: 4px; transition: .4s; border-radius: 50%; } input:checked + .slider { background-color: var(--primary-color); } input:checked + .slider:before { transform: translateX(30px); } .slider i { position: absolute; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--icon-color); transition: all 0.4s ease; } .slider .fa-sun { left: 8px; opacity: 1; } .slider .fa-moon { right: 8px; opacity: 0; } input:checked + .slider .fa-sun { opacity: 0; } input:checked + .slider .fa-moon { opacity: 1; }
        h1 { font-size: 2.5rem; font-weight: 700; margin: 0 0 0.5rem; }
        .subtitle { color: var(--sub-text-color); margin-bottom: 1rem; font-size: 1.1rem; }
        .stats { color: var(--sub-text-color); font-size: .9rem; margin-bottom: 2rem; background: var(--bg-color); padding: 0.5rem 1rem; border-radius: 8px; display: inline-block; }
        .stats strong { color: var(--text-color); }
        #shorten-form { display: flex; flex-direction: column; gap: 1rem; }
        .primary-inputs { display: grid; grid-template-columns: 3fr 2fr; gap: 1rem; }
        #shorten-form input, #shorten-form textarea { width: 100%; padding: 14px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); border-radius: 10px; font-size: 1rem; font-family: inherit; transition: all 0.2s ease; }
        #shorten-form input:focus, #shorten-form textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--shadow-color); }
        .tab-nav { display: flex; gap: 0.5rem; background-color: var(--bg-color); padding: 0.5rem; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 0.75rem; border: none; background: transparent; color: var(--sub-text-color); font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.9rem; }
        .tab-btn i { color: var(--icon-color); }
        .tab-btn.active { background-color: var(--container-bg); color: var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab-btn.active i { color: var(--primary-color); }
        .tab-content { display: none; margin-top: 1rem; }
        .tab-content.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        textarea { min-height: 100px; resize: vertical; }
        .main-button { padding: 16px 20px; border: none; border-radius: 10px; background-color: var(--primary-color); color: white; font-size: 1.125rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; }
        .main-button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .main-button:disabled { background-color: #9ca3af; cursor: not-allowed; transform: none; }
        .result-area { margin-top: 2rem; text-align: left; }
        .result-box { background: var(--bg-color); padding: 1rem; border-radius: 10px; margin-bottom: 1rem; border: 1px solid var(--border-color); }
        .result-box label { font-weight: 600; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--sub-text-color); }
        .result-box label i { color: var(--icon-color); }
        .link-wrapper { display: flex; align-items: center; gap: 1rem; background: var(--container-bg); padding: 0.75rem 1rem; border-radius: 8px; }
        .link-wrapper a { word-break: break-all; color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .copy-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; font-size: 0.875rem; background-color: var(--sub-text-color); color: white; border-radius: 6px; border: none; cursor: pointer; transition: background-color 0.2s ease; }
        .copy-btn:hover { background-color: var(--text-color); }
        .result-actions { display: flex; justify-content: center; margin-top: 1.5rem; }
        .qr-code-btn { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; background-color: var(--text-color); color: var(--container-bg); text-decoration: none; border-radius: 8px; font-weight: 600; }
        .hidden { display: none; }
        #error-message { margin-top: 1rem; background-color: #fef2f2; color: #ef4444; padding: 1rem; border-radius: 10px; border: 1px solid #fecaca; }
        @media (max-width: 640px) { .primary-inputs { grid-template-columns: 1fr; } h1 { font-size: 1.75rem; } body { padding: 1rem; } .container { padding: 1.5rem; } }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
        }

        .contact-link {
            color: var(--sub-text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .contact-link:hover {
            color: var(--primary-color);
            background-color: var(--container-bg);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="theme-toggle">
                    <input type="checkbox" id="theme-toggle" />
                    <span class="slider"><i class="fas fa-sun"></i><i class="fas fa-moon"></i></span>
                </label>
            </div>
            <h1>QuickLink Hyper</h1>
            <p class="subtitle">The ultimate URL shortener with premium, enterprise-grade features.</p>
            <p class="stats">Serving <strong id="link-counter">...</strong> links and counting!</p>
        </div>

        <form id="shorten-form">
             <div class="primary-inputs">
                <input type="url" id="long-url-input" placeholder="Your long URL (e.g., https://...)" required>
                <input type="text" id="alias-input" placeholder="Optional: your-custom-alias">
            </div>

            <div class="tab-nav">
                <button type="button" class="tab-btn active" data-tab="tab-access"><i class="fas fa-lock"></i>Access</button>
                <button type="button" class="tab-btn" data-tab="tab-marketing"><i class="fas fa-bullseye"></i>Marketing</button>
                <button type="button" class="tab-btn" data-tab="tab-targeting"><i class="fas fa-mobile-screen-button"></i>Targeting</button>
            </div>

            <div class="tab-content-container">
                <div id="tab-access" class="tab-content active">
                    <div class="grid">
                        <input type="text" id="password-input" placeholder="Password">
                        <input type="number" id="max-clicks-input" placeholder="Max Clicks (e.g., 100)">
                        <input type="text" id="geo-input" placeholder="Geo-fence (e.g., IN, US)">
                        <input type="datetime-local" id="expires-at-input" title="Expires at (your local time)">
                    </div>
                </div>
                <div id="tab-marketing" class="tab-content">
                    <div class="grid">
                        <input type="url" id="ab-test-url" placeholder="A/B Test URL (50% traffic)">
                        <input type="text" id="pixel-id" placeholder="Facebook Pixel ID">
                    </div>
                    <h4>UTM Builder</h4>
                    <div class="grid">
                        <input type="text" class="utm-param" data-utm="utm_source" placeholder="utm_source">
                        <input type="text" class="utm-param" data-utm="utm_medium" placeholder="utm_medium">
                        <input type="text" class="utm-param" data-utm="utm_campaign" placeholder="utm_campaign">
                    </div>
                </div>
                <div id="tab-targeting" class="tab-content">
                     <textarea id="custom-html-input" placeholder="Custom HTML for Splash Page (under 5KB)"></textarea>
                     <div class="grid">
                        <input type="url" id="ios-url-input" placeholder="iOS-specific URL">
                        <input type="url" id="android-url-input" placeholder="Android-specific URL">
                     </div>
                </div>
            </div>

            <button type="submit" id="submit-button" class="main-button">
                <i class="fas fa-rocket"></i><span>Create Hyper-Link!</span>
            </button>
        </form>

        <div id="result-area" class="hidden">
            <h2><i class="fas fa-check-circle" style="color: #22c55e;"></i> Your Hyper-Link is Ready!</h2>
            <div class="result-box">
                 <label><i class="fas fa-globe"></i>Public Short Link</label>
                 <div class="link-wrapper">
                     <a href="" id="public-link" target="_blank"></a>
                     <button class="copy-btn" data-clipboard-target="#public-link"><i class="far fa-copy"></i> Copy</button>
                 </div>
            </div>
            <div class="result-box">
                 <label><i class="fas fa-user-shield"></i>Admin Link (Keep this secret!)</label>
                 <div class="link-wrapper">
                     <a href="" id="admin-link" target="_blank"></a>
                     <button class="copy-btn" data-clipboard-target="#admin-link"><i class="far fa-copy"></i> Copy</button>
                 </div>
            </div>
            <div class="result-actions">
               <a id="qr-code-btn" class="qr-code-btn" href="" target="_blank"><i class="fas fa-qrcode"></i> Get QR Code</a>
            </div>
        </div>
        <div id="error-message" class="hidden"></div>
    </div>

    <footer class="footer">
        <a href="https://pranav-sharma.pages.dev/#contact" target="_blank" rel="noopener noreferrer" class="contact-link">
            <i class="fas fa-code"></i> Developed by Pranav Sharma
        </a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const WORKER_URL = 'https://link.z3957759.workers.dev';
            const form = document.getElementById('shorten-form');
            const submitButton = document.getElementById('submit-button');
            const resultArea = document.getElementById('result-area');
            const errorMessage = document.getElementById('error-message');
            const publicLink = document.getElementById('public-link');
            const adminLink = document.getElementById('admin-link');
            const qrCodeBtn = document.getElementById('qr-code-btn');

            const themeToggle = document.getElementById('theme-toggle');
            const lsTheme = localStorage.getItem('theme');
            if (lsTheme) {
                document.documentElement.setAttribute('data-theme', lsTheme);
                if (lsTheme === 'dark') themeToggle.checked = true;
            }
            themeToggle.addEventListener('change', (e) => {
                const theme = e.target.checked ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            });

            const tabNav = document.querySelector('.tab-nav');
            tabNav.addEventListener('click', (e) => {
                const clickedTab = e.target.closest('.tab-btn');
                if (!clickedTab) return;
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                clickedTab.classList.add('active');
                document.getElementById(clickedTab.dataset.tab).classList.add('active');
            });

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Creating...</span>';
                resultArea.classList.add('hidden');
                errorMessage.classList.add('hidden');

                const utmParams = {};
                document.querySelectorAll('.utm-param').forEach(input => { if (input.value) utmParams[input.dataset.utm] = input.value; });
                const iosUrl = document.getElementById('ios-url-input').value;
                const androidUrl = document.getElementById('android-url-input').value;
                const deviceUrls = (iosUrl || androidUrl) ? { ios: iosUrl, android: androidUrl } : null;

                const body = {
                    longUrl: document.getElementById('long-url-input').value,
                    alias: document.getElementById('alias-input').value,
                    password: document.getElementById('password-input').value,
                    maxClicks: document.getElementById('max-clicks-input').value,
                    geo: document.getElementById('geo-input').value,
                    abTestUrl: document.getElementById('ab-test-url').value,
                    pixelId: document.getElementById('pixel-id').value,
                    customHtml: document.getElementById('custom-html-input').value,
                    utmParams: Object.keys(utmParams).length ? utmParams : null,
                    deviceUrls: deviceUrls,
                };

                const expiresAtLocal = document.getElementById('expires-at-input').value;
                if (expiresAtLocal) body.expiresAt = new Date(expiresAtLocal).toISOString();

                const filteredBody = Object.fromEntries(Object.entries(body).filter(([_, v]) => v != null && v !== ''));

                try {
                    const response = await fetch(`${WORKER_URL}/api/shorten`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(filteredBody),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || `An error occurred: ${response.statusText}`);
                    }

                    const data = await response.json();

                    publicLink.href = data.publicUrl;
                    publicLink.textContent = data.publicUrl.replace(/^https?:\/\//, '');
                    adminLink.href = data.adminUrl;
                    adminLink.textContent = data.adminUrl.replace(/^https?:\/\//, '');
                    qrCodeBtn.href = data.publicUrl + '/qr';

                    resultArea.classList.remove('hidden');
                    form.reset();
                    document.querySelectorAll('.tab-btn')[0].click();

                } catch (error) {
                    errorMessage.textContent = `Error: ${error.message}`;
                    errorMessage.classList.remove('hidden');
                } finally {
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-rocket"></i><span>Create Hyper-Link!</span>';
                }
            });

            document.querySelectorAll('.copy-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const originalHTML = e.currentTarget.innerHTML;
                    const targetSelector = e.currentTarget.dataset.clipboardTarget;
                    navigator.clipboard.writeText(document.querySelector(targetSelector).href).then(() => {
                        e.currentTarget.innerHTML = '<i class="fas fa-check"></i> Copied!';
                        setTimeout(() => { e.currentTarget.innerHTML = originalHTML; }, 2000);
                    });
                });
            });

            async function loadStats() {
                try {
                    const response = await fetch(`${WORKER_URL}/api/stats`);
                    if (!response.ok) return;
                    const data = await response.json();
                    document.getElementById('link-counter').textContent = new Intl.NumberFormat().format(data.totalLinks);
                } catch (error) { console.error('Could not load stats:', error); }
            }
            loadStats();
        });
    </script>
</body>
</html>
